# La web servida desde el VPS (antes Vercel). Traefik pone HTTPS y HSTS delante.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/wasm;
  gzip_min_length 1024;

  types {
    application/wasm wasm;
    application/javascript mjs;
  }

  # Los archivos con hash en el nombre no cambian nunca: caché de un año.
  location /assets/ {
    include /etc/nginx/cabeceras.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Modelos y fuentes (vad, mediapipe, fuentes): sin hash, caché de un día.
  location ~* \.(onnx|wasm|task|tflite|woff2|webp|png|jpg|svg)$ {
    include /etc/nginx/cabeceras.conf;
    add_header Cache-Control "public, max-age=86400" always;
    try_files $uri =404;
  }

  # SPA: toda ruta que no es un archivo va a index.html, que no se cachea para
  # que un despliegue nuevo llegue en la siguiente recarga.
  location / {
    include /etc/nginx/cabeceras.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }
}
