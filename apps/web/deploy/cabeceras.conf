# Las mismas cabeceras que daba vercel.json (ver VERCEL.md). Van en un archivo
# aparte porque nginx descarta los add_header del server en cuanto una location
# declara uno propio: cada location lo incluye entero.
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Embedder-Policy "credentialless" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://uzuysjmymvtpoxfrdxnm.supabase.co; media-src 'self' blob: https://uzuysjmymvtpoxfrdxnm.supabase.co; font-src 'self' data:; connect-src 'self' https://uzuysjmymvtpoxfrdxnm.supabase.co wss://uzuysjmymvtpoxfrdxnm.supabase.co https://api.proctoring-upao.app https://api.86-48-18-81.sslip.io; frame-src 'none'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=(), usb=()" always;
