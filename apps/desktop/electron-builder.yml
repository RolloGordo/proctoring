appId: com.proctoring.desktop
productName: Proctoring
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
win:
  executableName: proctoring
nsis:
  artifactName: ${productName}-${version}-instalador.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
# De donde salen las descargas. Era `https://example.com/auto-updates`, el
# marcador que trae la plantilla de electron-vite: no es nuestro y no existe.
#
# `electron-builder --publish` sube el instalador aqui, y la aplicacion consulta
# esta misma publicacion al arrancar para avisar de que hay una version nueva
# (`src/main/actualizaciones.ts`). Avisa, no se reemplaza sola: sin certificado
# de firma la sustitucion automatica en Windows no es fiable, y en una
# aplicacion de supervision conviene que el estudiante vea lo que instala.
publish:
  provider: github
  owner: RolloGordo
  repo: proctoring
