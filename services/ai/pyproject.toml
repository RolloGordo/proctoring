[project]
name = "proctoring-audio-spike"
version = "0.1.0"
description = "SP-007 reproducible Spanish transcription experiment"
requires-python = ">=3.12,<3.13"
dependencies = [
    "av==16.1.0",
    "faster-whisper>=1.2,<2",
    "httpx>=0.28,<1",
    "huggingface-hub>=1,<2",
    "truststore>=0.10,<1",
]

[dependency-groups]
dev = [
    "mypy>=1.15,<2",
    "pytest>=8,<10",
    "ruff>=0.11,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
