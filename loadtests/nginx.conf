# Balanceador de la prueba de carga (ADR-0011).
#
# Reparte entre las réplicas de la API que haya: `docker compose --scale api=N`
# crea N contenedores con el mismo nombre de servicio, y el DNS de Docker
# devuelve las N direcciones. `resolve` + `zone` hace que nginx vuelva a
# preguntar cada 5 s, así que una réplica nueva entra sola sin reiniciarlo.

worker_processes auto;

events {
  worker_connections 4096;
}

http {
  resolver 127.0.0.11 valid=5s ipv6=off;
  access_log off;

  upstream api {
    # A la réplica con menos peticiones en curso, no por turno: una entrega de
    # examen tarda más que guardar una respuesta, y por turno se amontonarían
    # detrás de la lenta.
    least_conn;
    zone api 64k;
    server api:8000 resolve max_fails=3 fail_timeout=10s;
    # Conexiones reutilizadas hacia las réplicas: sin esto, cada petición abre
    # una TCP nueva y bajo carga se agotan los puertos efímeros.
    keepalive 64;
  }

  server {
    listen 80;

    location = /lb-health {
      return 200 "ok\n";
    }

    location / {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      # La API solo cree esta cabecera si viene de un proxy de confianza
      # (TRUSTED_PROXIES): así limita por la IP real y no por la del balanceador.
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # Si una réplica cae a mitad de petición, se reintenta en otra, pero solo
      # lo idempotente: reintentar un POST podría entregar un examen dos veces.
      proxy_next_upstream error timeout http_502 http_503;
      proxy_next_upstream_tries 2;
      proxy_connect_timeout 2s;
      proxy_read_timeout 30s;
      client_max_body_size 2m;
    }
  }
}
