  #   build:
  #     context: ./services/ai
  #   container_name: proctoring-ai
  #   ports:
  #     - "8001:8001"
  #   env_file:
  #     - .env
  #   depends_on:
  #     redis:
  #       condition: service_healthy
  #
  # ai-worker:
  #   build:
  #     context: ./services/ai
  #   container_name: proctoring-ai-worker
  #   command: ["python", "worker_stub.py"]
  #   env_file:
  #     - .env
  #   depends_on:
  #     redis:
  #       condition: service_healthy

networks:
  default:
    name: proctoring
