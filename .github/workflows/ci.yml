name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Si se empuja otra vez a la misma rama, se cancela la ejecucion anterior: en el
# plan gratuito los minutos de Actions son limitados.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Que partes del monorepo existen ya.
  #
  # `hashFiles` no se puede usar en el `if` de un job (GitHub solo lo acepta
  # dentro de steps), asi que la deteccion se hace aqui y los jobs de web y
  # escritorio miran esta salida.
  # ---------------------------------------------------------------------------
  detect:
    name: Detectar que hay en el repo
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.check.outputs.web }}
      desktop: ${{ steps.check.outputs.desktop }}

    steps:
      - uses: actions/checkout@v4

      - id: check
        run: |
          test -f apps/web/package.json && web=true || web=false
          test -f apps/desktop/package.json && desktop=true || desktop=false
          echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "desktop=$desktop" >> "$GITHUB_OUTPUT"
          echo "web=$web  desktop=$desktop"

  # ---------------------------------------------------------------------------
  # API principal: lint, formato, tipos, pruebas y la prueba de ARQUITECTURA.
  # ---------------------------------------------------------------------------
  api:
    name: API (lint, tipos, pruebas, arquitectura)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api

    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: services/api/uv.lock

      - name: Instalar dependencias
        # --locked falla si uv.lock no coincide con pyproject.toml, en vez de
        # resolver por su cuenta: el CI prueba lo mismo que corre en local.
        run: uv sync --locked

      - name: Lint (ruff)
        run: uv run ruff check --output-format=github .

      - name: Formato (ruff)
        run: uv run ruff format --check .

      - name: Tipos (mypy)
        run: uv run mypy src tests

      - name: Pruebas (pytest)
        run: uv run pytest

      - name: Arquitectura hexagonal (import-linter)
        # Comprueba que adapters -> application -> domain nunca se invierta y que
        # el nucleo no importe frameworks. Si esto falla, el PR no entra aunque
        # las pruebas pasen.
        run: uv run lint-imports

  # ---------------------------------------------------------------------------
  # Contrato compartido: los ejemplos tienen que cumplir el esquema, y no puede
  # faltar ninguno. Es lo que impide que la API y los clientes se separen.
  # ---------------------------------------------------------------------------
  contracts:
    name: Contrato de evento
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar jsonschema
        run: python -m pip install --quiet jsonschema

      - name: Validar esquema y ejemplos
        run: python packages/contracts/validate.py

  # ---------------------------------------------------------------------------
  # La imagen tiene que seguir construyendo. No se publica: solo se comprueba.
  # ---------------------------------------------------------------------------
  docker:
    name: Imagen de la API
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Construir la imagen
        uses: docker/build-push-action@v6
        with:
          context: services/api
          push: false
          load: true
          tags: proctoring-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Arrancar el contenedor y comprobar /health
        run: |
          docker run -d --name api-ci -p 8000:8000 \
            -e ENV=local -e AUTH_ENABLED=false \
            -e EVENT_REPOSITORY=memory -e JOB_QUEUE=memory \
            proctoring-api:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health > /dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:8000/health
          echo

      - name: Un POST real contra el contenedor
        run: |
          curl -fsS -X POST http://localhost:8000/api/v1/events \
            -H "Content-Type: application/json" \
            --data-binary @packages/contracts/examples/focus_lost.json
          echo

      - name: La API no debe arrancar sin autenticacion fuera de local
        run: |
          if docker run --rm -e ENV=production -e AUTH_ENABLED=false \
               -e EVENT_REPOSITORY=memory -e JOB_QUEUE=memory \
               proctoring-api:ci \
               uvicorn proctoring_api.main:create_app --factory --host 0.0.0.0 --port 8000 \
               > salida.txt 2>&1; then
            echo "FALLO: la API arranco sin autenticacion con ENV=production"
            exit 1
          fi
          grep -q "AUTH_ENABLED" salida.txt
          echo "Correcto: se nego a arrancar."

      - name: Logs del contenedor si algo fallo
        if: failure()
        run: docker logs api-ci || true

  # ---------------------------------------------------------------------------
  # Web y escritorio: se saltan solos mientras no exista su package.json, para
  # que el CI no este rojo mientras los companeros arrancan.
  # ---------------------------------------------------------------------------
  web:
    name: Web del docente
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.web == 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci
        working-directory: apps/web

      - run: npm run lint
        working-directory: apps/web

      - run: npm run build
        working-directory: apps/web

  desktop:
    name: App de escritorio
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.desktop == 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - run: npm ci
        working-directory: apps/desktop

      - run: npm run lint
        working-directory: apps/desktop

      - run: npm run build
        working-directory: apps/desktop
